name: Flutter CI/CD (X10 Production)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build, Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: 📥 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze code (Lint)
        run: flutter analyze

      - name: 🧪 Run tests
        run: flutter test --reporter=compact

      - name: 🏗️ Build Release APK
        run: flutter build apk --release

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IQ-Market-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  rules-tests:
    name: Security Rules & Functions Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java (for Firebase emulators)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 📥 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🔐 Run Firestore/Storage rules & functions tests
        run: firebase emulators:exec --only firestore,storage "npm run test:all"
