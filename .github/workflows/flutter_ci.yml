name: Flutter CI/CD (X10 Production)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: 📥 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze code (Lint)
        run: flutter analyze

      - name: 🧪 Run tests
        run: flutter test --reporter=compact

  rules-tests:
    name: Security Rules & Functions Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java (for Firebase emulators)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 📥 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🔐 Run Firestore/Storage rules & functions tests
        continue-on-error: true
        run: firebase emulators:exec --only firestore,storage "npm run test:all"

  # Собирает НАСТОЯЩИЙ подписанный .aab для загрузки в Google Play.
  build-signed-release:
    name: Build REAL signed .aab for Google Play
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: 📥 Install dependencies
        run: flutter pub get

      - name: 🔑 Restore real signing keystore
        env:
          KEYSTORE_B64_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          KEY_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64_SECRET" ]; then
            printf '%s' "$KEYSTORE_B64_SECRET" | base64 --decode --ignore-garbage > android/app/upload-keystore.jks
          fi
          if [ ! -s android/app/upload-keystore.jks ] && [ -f android/app/upload-keystore.b64 ]; then
            base64 --decode --ignore-garbage android/app/upload-keystore.b64 > android/app/upload-keystore.jks
          fi

          cp android/app/upload-keystore.jks android/upload-keystore.jks

          STORE_PASS="$STORE_PASS_SECRET"
          [ -z "$STORE_PASS" ] && STORE_PASS="iqmarket2026"
          KEY_PASS="$KEY_PASS_SECRET"
          [ -z "$KEY_PASS" ] && KEY_PASS="iqmarket2026"
          KEY_ALIAS="$KEY_ALIAS_SECRET"
          [ -z "$KEY_ALIAS" ] && KEY_ALIAS="upload"

          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          EOF

          echo "Keystore file size: $(wc -c < android/app/upload-keystore.jks) bytes"
          sed -i 's/-Xmx1536m/-Xmx4096m/g' android/gradle.properties

      - name: 🏗️ Build App Bundle (REAL signature — ready for Google Play)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"
        run: flutter build appbundle --release

      - name: 🚀 Upload real signed .aab
        uses: actions/upload-artifact@v4
        with:
          name: IQ-Market-SIGNED-ReadyForPlayStore
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
