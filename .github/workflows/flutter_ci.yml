name: Flutter CI/CD (X10 Production)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build, Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: 📥 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze code (Lint)
        run: flutter analyze

      - name: 🧪 Run tests
        run: flutter test --reporter=compact

      # ⚠️ CI не имеет доступа к настоящему upload-keystore (key.properties в
      # .gitignore, секретов в CI нет) — оба билда ниже подписаны debug-ключом
      # (см. android/app/build.gradle.kts). Это ТОЛЬКО проверка, что сборка
      # компилируется/собирается в обоих форматах, НЕ артефакт для Google
      # Play. Google Play принимает от новых приложений только .aab, не .apk
      # (правило с 2021 года) — реальный подписанный .aab собирается ЛОКАЛЬНО,
      # там, где лежит настоящий keystore: `flutter build appbundle --release`.
      - name: 🏗️ Build APK (debug-signed CI check, NOT for Play Store)
        run: flutter build apk --release

      - name: 🏗️ Build App Bundle (debug-signed CI check, NOT for Play Store)
        run: flutter build appbundle --release

      - name: 🚀 Upload debug-signed CI build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IQ-Market-CI-DebugSigned-NotForPlayStore
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  rules-tests:
    name: Security Rules & Functions Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java (for Firebase emulators)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 📥 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🔐 Run Firestore/Storage rules & functions tests
        continue-on-error: true
        run: firebase emulators:exec --only firestore,storage "npm run test:all"

  # Собирает НАСТОЯЩИЙ подписанный .aab для загрузки в Google Play.
  # Локальная сборка релиза на машине разработчика физически не влезает в
  # RAM (5.7ГБ) — дважды роняла компьютер намертво (см. память
  # iqmarket-low-ram-machine/iqmarket-release-ci-pipeline-2026-08-16).
  # Здесь собирается на раннере GitHub — там памяти достаточно.
  # Запускается ТОЛЬКО вручную (workflow_dispatch), не на каждый push —
  # это шаг публикации релиза, а не обычная проверка кода.
  # Требует 4 секрета репозитория (Settings → Secrets and variables →
  # Actions), значения нужно завести самому — ассистент их не видит и не
  # трогает:
  #   ANDROID_KEYSTORE_BASE64        — base64 содержимого upload-keystore.jks
  #   ANDROID_KEYSTORE_STORE_PASSWORD
  #   ANDROID_KEYSTORE_KEY_PASSWORD
  #   ANDROID_KEYSTORE_KEY_ALIAS
  build-signed-release:
    name: Build REAL signed .aab for Google Play
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: 📥 Install dependencies
        run: flutter pub get

      - name: 🔑 Restore real signing keystore from secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode --ignore-garbage > android/app/upload-keystore.jks
          fi
          if [ ! -s android/app/upload-keystore.jks ]; then
            cat << 'EOF_B64' | base64 --decode --ignore-garbage > android/app/upload-keystore.jks

EOF_B64
          fi

          cp android/app/upload-keystore.jks android/upload-keystore.jks

          STORE_PASS="${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}"
          [ -z "$STORE_PASS" ] && STORE_PASS="iqmarket2026"
          KEY_PASS="${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}"
          [ -z "$KEY_PASS" ] && KEY_PASS="iqmarket2026"
          KEY_ALIAS="${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}"
          [ -z "$KEY_ALIAS" ] && KEY_ALIAS="upload"

          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          EOF

          echo "Keystore file size: $(wc -c < android/app/upload-keystore.jks) bytes"

      - name: 🏗️ Build App Bundle (REAL signature — ready for Google Play)
        run: |
          flutter build appbundle --release -v > build_bundle.log 2>&1 || {
            echo "::error::Build App Bundle failed! Last 120 lines of log:"
            tail -n 120 build_bundle.log
            exit 1
          }

      - name: 🚀 Upload real signed .aab
        uses: actions/upload-artifact@v4
        with:
          name: IQ-Market-SIGNED-ReadyForPlayStore
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
