name: Flutter CI/CD (X10 Production)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x' # Версия Flutter
          channel: 'stable'
          cache: true

      - name: 📥 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze code (Lint)
        run: flutter analyze

      # У тебя пока нет папки test, но мы оставляем этот шаг на будущее
      # - name: 🧪 Run tests
      #   run: flutter test

      - name: 🏗️ Build Release APK
        run: flutter build apk --release

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IQ-Market-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
