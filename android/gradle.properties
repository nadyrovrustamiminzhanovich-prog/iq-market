# Выделяем Gradle оптимальный объем RAM, чтобы не перегружать систему
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# Оптимизация Kotlin Daemon
kotlin.daemon.jvm.options=-Xmx1024m
# Отключаем параллельную сборку для снижения пикового потребления памяти
org.gradle.parallel=false
# Включаем кэширование
org.gradle.caching=true
# Использование AndroidX
android.useAndroidX=true
android.enableJetifier=false
# ИСПОЛЬЗУЕМ ВЕРСИЮ 2 ЧТОБЫ ИЗБЕЖАТЬ БИТОГО METADATA.BIN
gradle.user.home=D:/iqmarket/.gradle_home
kotlin.incremental=false
kotlin.incremental.js=false