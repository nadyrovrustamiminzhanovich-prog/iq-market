# Уменьшаем аппетиты Gradle до 1.5Гб для стабильности
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Оптимизация Kotlin Daemon
kotlin.daemon.jvm.options=-Xmx768m
# Отключаем параллельную сборку для снижения нагрузки на CPU
org.gradle.parallel=false
# Включаем кэширование
org.gradle.caching=true
# Использование AndroidX
android.useAndroidX=true
android.enableJetifier=false
# ИСПОЛЬЗУЕМ ВЕРСИЮ 2 ЧТОБЫ ИЗБЕЖАТЬ БИТОГО METADATA.BIN
gradle.user.home=D:/iqmarket/.gradle_home
kotlin.incremental=false
kotlin.incremental.js=false