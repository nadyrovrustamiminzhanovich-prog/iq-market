# Оптимизация под низкий объем RAM (строго до 1.5GB)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx768m
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true

# Использование AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Путь к кэшу Gradle
gradle.user.home=D:/iqmarket/.gradle_home

# Отключаем инкрементальную компиляцию Kotlin из-за бага Windows (проект на D:, кэш pub на C: вызывает ошибку "different roots")
kotlin.incremental=false
kotlin.incremental.js=false