name: iqmarket
description: "IQ-Market — маркетплейс объявлений и такси-сервис для Казахстана"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_nav_bar: ^5.0.7
  line_icons: ^2.0.3
  screen_protector: ^1.5.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  mask_text_input_formatter: ^2.9.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  local_auth: ^3.0.1
  shared_preferences: ^2.2.3
  google_generative_ai: ^0.4.0
  video_player: ^2.8.2
  path: ^1.9.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_fonts: ^8.0.2
  flutter_tts: ^4.0.2
  speech_to_text: ^7.3.0
  video_trimmer: ^5.0.0
  firebase_storage: ^13.3.0
  path_provider: ^2.1.3
  flutter_markdown_plus: ^1.0.7
  file_picker: ^11.0.2
  intl: ^0.20.2
  http: ^1.2.1
  audioplayers: ^6.6.0
  record: ^6.2.0
  provider: ^6.1.2
  phosphor_flutter: ^2.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_image_compress: ^2.4.0
  firebase_messaging: ^16.2.0
  firebase_analytics: ^12.3.0
  flutter_local_notifications: ^21.0.0
  gal: ^2.3.2
  pro_image_editor: ^12.4.4
  share_plus: ^10.1.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  video_compress: ^3.1.4
  connectivity_plus: ^7.1.1
  infinite_scroll_pagination: ^5.1.1
  firebase_app_check: ^0.4.3
  fl_chart: ^1.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png
    - assets/images/
  fonts:
    - family: ArystapStyle
      fonts:
        - asset: assets/fonts/MonsieurLaDoulaise-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A1854"
  adaptive_icon_foreground: "assets/icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false